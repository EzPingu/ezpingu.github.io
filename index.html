<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EzPingu — Staff Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ⚙️  CONTENUTO DA MODIFICARE → vai in fondo al file, nel tag
   <script>, dentro l'oggetto PROFILE. Tutto il resto è solo
   grafica e non serve toccarlo.
   ============================================================ */

:root{
  --bg:#080b10;
  --bg-2:#0d1219;
  --surface:#10161f;
  --surface-2:#141b26;
  --border:#1f2833;
  --text:#eef3f7;
  --muted:#7c8a9a;
  --cyan:#35e0ea;
  --cyan-dim:#35e0ea33;
  --teal:#2ee6b8;
  --purple:#b48cff;
  --blue:#5b9dff;
  --green:#5fe08a;
  --red:#ff5e78;
  --gray:#8b98a8;
  --radius:16px;
  --sidebar-w:250px;
}

*{box-sizing:border-box; margin:0; padding:0;}

html{scroll-behavior:smooth;}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter', sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* ---------- background atmosphere ---------- */
.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:48px 48px;
  opacity:.25;
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, black 20%, transparent 75%);
  mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, black 20%, transparent 75%);
}
.bg-glow{
  position:fixed; z-index:0; pointer-events:none; filter:blur(90px); opacity:.35;
  border-radius:50%;
}
.bg-glow.one{ width:480px; height:480px; background:var(--cyan); top:-160px; left:-120px; }
.bg-glow.two{ width:420px; height:420px; background:var(--purple); bottom:-140px; right:-100px; }
.bg-glow.three{ width:340px; height:340px; background:var(--teal); top:40%; left:60%; opacity:.14; }

@keyframes drift{
  0%,100%{ transform:translate(0,0); }
  50%{ transform:translate(30px,-20px); }
}
.bg-glow.one{ animation:drift 14s ease-in-out infinite; }
.bg-glow.two{ animation:drift 18s ease-in-out infinite reverse; }
.bg-glow.three{ animation:drift 22s ease-in-out infinite; }

/* ---------- layout ---------- */
.app{
  position:relative; z-index:1;
  max-width:1180px;
  margin:0 auto;
  padding:56px 24px 90px;
  display:flex;
  gap:28px;
  align-items:flex-start;
}

/* ---------- sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg, var(--surface), var(--surface-2));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:10px;
  position:sticky;
  top:56px;
  opacity:0;
  transform:translateX(-16px);
  animation:enter .6s cubic-bezier(.2,.8,.2,1) .05s forwards;
}
.sidebar-title{
  display:flex; align-items:center; gap:8px;
  padding:12px 14px 14px;
  color:var(--muted);
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  border-bottom:1px solid var(--border);
  margin-bottom:8px;
}
.sidebar-title .dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

.nav-btn{
  width:100%;
  display:flex; align-items:center; gap:11px;
  padding:12px 14px;
  background:transparent;
  border:none;
  border-radius:10px;
  color:var(--muted);
  font-family:'Inter', sans-serif;
  font-size:14.5px;
  font-weight:500;
  cursor:pointer;
  text-align:left;
  position:relative;
  transition:color .25s ease, background .25s ease;
  margin-bottom:4px;
}
.nav-btn svg{ width:17px; height:17px; flex-shrink:0; opacity:.8; transition:opacity .25s ease; }
.nav-btn:hover{ color:var(--text); background:#ffffff08; }
.nav-btn.active{
  color:var(--text);
  background:linear-gradient(90deg, var(--cyan-dim), transparent);
}
.nav-btn.active svg{ opacity:1; }
.nav-btn.active::before{
  content:'';
  position:absolute; left:0; top:8px; bottom:8px; width:3px;
  border-radius:3px;
  background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);
}

/* ---------- main panel ---------- */
.panel{
  flex:1;
  min-width:0;
  background:linear-gradient(180deg, var(--surface), var(--surface-2));
  border:1px solid var(--border);
  border-radius:20px;
  padding:52px 48px 60px;
  position:relative;
  overflow:hidden;
  opacity:0;
  transform:translateY(14px);
  animation:enter .65s cubic-bezier(.2,.8,.2,1) .15s forwards;
}
.panel::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--cyan-dim), transparent);
}

.view{ display:none; }
.view.active{ display:block; animation:fadein .5s ease both; }
@keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
@keyframes enter{ to{opacity:1; transform:translate(0,0);} }

/* ---------- eyebrow / heading ---------- */
.view-header{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:8px;
}
.view-header svg{ width:19px; height:19px; color:var(--cyan); }
.view-title{
  font-family:'Space Grotesk', sans-serif;
  font-size:15px; font-weight:600;
  letter-spacing:.02em;
}

/* ---------- avatar / hero ---------- */
.hero{ text-align:center; margin:34px 0 30px; }
.avatar-wrap{
  position:relative;
  width:128px; height:128px;
  margin:0 auto 22px;
}
.avatar-ring{
  position:absolute; inset:-6px;
  border-radius:50%;
  background:conic-gradient(from 0deg, var(--cyan), var(--purple), var(--teal), var(--cyan));
  animation:spin 6s linear infinite;
  filter:drop-shadow(0 0 14px var(--cyan-dim));
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.avatar{
  position:absolute; inset:4px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #1b2531, #0a0e14);
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk', sans-serif;
  font-size:38px; font-weight:700;
  color:var(--cyan);
  z-index:1;
}
.avatar-scan{
  position:absolute; inset:4px; border-radius:50%; overflow:hidden; z-index:2; pointer-events:none;
}
.avatar-scan::after{
  content:'';
  position:absolute; left:0; right:0; height:38%;
  background:linear-gradient(180deg, transparent, #35e0ea55, transparent);
  animation:scan 3.2s ease-in-out infinite;
}
@keyframes scan{
  0%{ top:-40%; }
  50%{ top:100%; }
  100%{ top:-40%; }
}

.name{
  font-family:'Space Grotesk', sans-serif;
  font-size:38px; font-weight:700;
  letter-spacing:-.01em;
  background:linear-gradient(90deg, var(--cyan), var(--teal));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:10px;
}
.role{
  display:inline-flex; align-items:center; gap:7px;
  color:var(--muted);
  font-size:15px; font-weight:500;
  margin-bottom:22px;
}
.role svg{ width:14px; height:14px; }

.stat-row{
  display:flex; justify-content:center; gap:36px; flex-wrap:wrap;
  font-size:14px;
}
.stat-row b{ color:var(--text); font-weight:600; }
.stat-row span{ color:var(--muted); }

/* ---------- section label ---------- */
.section-label{
  display:flex; align-items:center; gap:9px;
  justify-content:center;
  margin:44px 0 18px;
  color:var(--muted);
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.section-label svg{ width:14px; height:14px; }
.section-label::before, .section-label::after{
  content:''; height:1px; width:60px;
  background:linear-gradient(90deg, transparent, var(--border));
}
.section-label::after{ background:linear-gradient(90deg, var(--border), transparent); }

/* ---------- grid / cards ---------- */
.grid{
  display:grid; grid-template-columns:1fr 1fr; gap:14px;
}
@media (max-width:640px){ .grid{ grid-template-columns:1fr; } }

.card{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px 18px;
  text-align:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  text-decoration:none;
  color:inherit;
  display:block;
  opacity:0;
  transform:translateY(10px);
  animation:card-in .5s cubic-bezier(.2,.8,.2,1) forwards;
  transition:border-color .25s ease, transform .25s ease, box-shadow .25s ease;
}
@keyframes card-in{ to{opacity:1; transform:translateY(0);} }

.card::before{
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(120px 80px at 50% 0%, var(--cyan-dim), transparent 70%);
  opacity:0;
  transition:opacity .3s ease;
}
.card:hover{
  transform:translateY(-3px);
  border-color:var(--cyan);
  box-shadow:0 10px 26px -12px #000, 0 0 0 1px var(--cyan-dim);
}
.card:hover::before{ opacity:1; }
.card:active{ transform:translateY(-1px) scale(.99); }

.card-title{
  font-weight:600; font-size:15px;
  margin-bottom:5px;
  position:relative;
}
.card-period{
  color:var(--muted); font-size:12.5px;
  margin-bottom:12px;
  font-family:'JetBrains Mono', monospace;
  position:relative;
}
.card-value{
  color:var(--cyan); font-weight:600; font-size:14.5px;
  position:relative;
}

.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px; font-weight:600;
  letter-spacing:.06em;
  padding:5px 11px;
  border-radius:7px;
  border:1px solid transparent;
  position:relative;
}
.badge svg{ width:10px; height:10px; }
.badge.cyan{  color:var(--cyan);   background:#35e0ea18; border-color:#35e0ea3d; }
.badge.teal{  color:var(--teal);   background:#2ee6b818; border-color:#2ee6b83d; }
.badge.green{ color:var(--green);  background:#5fe08a18; border-color:#5fe08a3d; }
.badge.blue{  color:var(--blue);   background:#5b9dff18; border-color:#5b9dff3d; }
.badge.purple{color:var(--purple); background:#b48cff18; border-color:#b48cff3d; }
.badge.red{   color:var(--red);    background:#ff5e7818; border-color:#ff5e783d; }
.badge.gray{  color:var(--gray);   background:#8b98a818; border-color:#8b98a83d; }

.link-icon{
  width:26px; height:26px;
  margin:0 auto 10px;
  color:var(--muted);
  transition:color .25s ease, transform .25s ease;
}
.card:hover .link-icon{ color:var(--cyan); transform:scale(1.08); }

.category-label{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600; font-size:14px;
  color:var(--text);
  margin:30px 0 12px;
  display:flex; align-items:center; gap:8px;
}
.category-label:first-of-type{ margin-top:6px; }
.category-label::before{
  content:''; width:6px; height:6px; border-radius:50%;
  background:var(--cyan); box-shadow:0 0 8px var(--cyan);
}

/* open indicator */
.go{
  position:absolute; top:14px; right:14px;
  width:16px; height:16px; color:var(--muted);
  opacity:0; transform:translate(-4px,4px);
  transition:opacity .25s ease, transform .25s ease;
}
.card:hover .go{ opacity:1; transform:translate(0,0); color:var(--cyan); }

/* scrollbar */
::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }

@media (max-width:820px){
  .app{ flex-direction:column; }
  .sidebar{ width:100%; position:relative; top:0; display:flex; gap:4px; }
  .nav-btn{ flex:1; justify-content:center; }
  .panel{ padding:36px 20px 44px; }
  .name{ font-size:30px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow one"></div>
<div class="bg-glow two"></div>
<div class="bg-glow three"></div>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-title"><span class="dot"></span> Menu</div>
    <button class="nav-btn active" data-view="about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      About myself
    </button>
    <button class="nav-btn" data-view="experience">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.1-3.1a4 4 0 01-5.3 5.3L7 20l-3-3 8.5-8.5a4 4 0 015.3-5.3l-3.1 3.1z"/></svg>
      Staff Experience
    </button>
  </aside>

  <main class="panel">

    <!-- ================= ABOUT ================= -->
    <section id="about" class="view active">
      <div class="view-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span class="view-title">About myself</span>
      </div>

      <div class="hero">
        <div class="avatar-wrap">
          <div class="avatar-ring"></div>
          <div class="avatar" id="avatarInitial"></div>
          <div class="avatar-scan"></div>
        </div>
        <h1 class="name" id="pName"></h1>
        <div class="role"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span id="pRole"></span></div>
        <div class="stat-row" id="pStats"></div>
      </div>

      <div class="section-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a4 4 0 00-3-3.9M9 20H4v-2a4 4 0 013-3.9m5-3a4 4 0 100-8 4 4 0 000 8zm6 1a4 4 0 100-8"/></svg>
        Currently
      </div>
      <div class="grid" id="currentlyGrid"></div>

      <div class="section-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.5.4l2-2a5 5 0 00-7-7l-1.2 1.1M14 11a5 5 0 00-7.5-.4l-2 2a5 5 0 007 7l1.1-1.1"/></svg>
        Links
      </div>
      <div class="grid" id="linksGrid"></div>
    </section>

    <!-- ================= EXPERIENCE ================= -->
    <section id="experience" class="view">
      <div class="view-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.1-3.1a4 4 0 01-5.3 5.3L7 20l-3-3 8.5-8.5a4 4 0 015.3-5.3l-3.1 3.1z"/></svg>
        <span class="view-title">Staff Experience</span>
      </div>
      <div id="experienceContent"></div>
    </section>

  </main>
</div>

<script>
/* ==========================================================================
   ✏️  MODIFICA SOLO QUI SOTTO — tutto il resto del file è grafica/animazioni
   ==========================================================================
   - "link": true metti l'URL che vuoi far aprire quando si clicca la card.
   - "color" può essere: cyan, teal, green, blue, purple, red, gray.
   - Per aggiungere/togliere card, copia o cancella un blocco { ... }.
   ========================================================================== */

const PROFILE = {
  name: "EzPingu",
  avatarInitial: "P",          // lettera mostrata se non hai una foto
  role: "Staff & SS Checker",
  stats: [
    { label: "Age", value: "17 y/o" },
    { label: "Place", value: "Italy" },
    { label: "Occupation", value: "Student • Staff Minecraft" }
  ],

  currently: [
    {
      title: "[1.9+] Tierlist CoralMC",
      badge: "SS VERIFIED", color: "red",
      link: "https://discord.com/invite/YOUR-SERVER"
    }
  ],

  links: [
    { name: "Discord", value: "@EzPingu", icon: "discord", link: "https://discord.com/users/YOUR-ID" },
    { name: "Guns",  value: "EzPingu",  icon: "gunslol",  link: "https://namemc.com/profile/EzPingu" }
  ],

  experience: {
    "Minecraft": [
      { name: "LunariaMC", period: "January 2025", badge: "STAFFER, SUPPORTER", color: "teal", link: "#" },
      { name: "ScarletMC", period: "July 2025 to September 2025", badge: "MOD, HEAD SS", color: "green", link: "#" },
      { name: "FruitMC", period: "October 2025 to June 2026", badge: "ADMIN, HEAD SS", color: "teal", link: "#" },
      { name: "AuraMC", period: "June 2026", badge: "MOD, SS MANAGER", color: "blue", link: "#" }
    ],
    "Discord": [
      { name: "[1.8] Tierlist CoralMC", period: "December 2025 to March 2026", badge: "SS VERIFIED", color: "blue", link: "#" },
      { name: "[1.9+] Tierlist CoralMC", period: "December 2025 to now", badge: "SS VERIFIED", color: "red", link: "#" },
      { name: "RBWCM", period: "January 2026 to February 2026", badge: "SS VERIFIED", color: "purple", link: "#" },
      { name: "[1.8] Tier Tests", period: "February 2026 to May 2026", badge: "SS VERIFIED", color: "blue", link: "#" },
      { name: "[1.21+] Tier Tests", period: "February 2026 to May 2026", badge: "SS VERIFIED", color: "cyan", link: "#" },
      { name: "detect.ac", period: "March 2026", badge: "PC CHECKER", color: "green", link: "#" }
    ]
  }
};

/* ========================================================================
   Da qui in giù è motore di rendering: normalmente non serve toccarlo.
   ======================================================================== */

const ICONS = {
  discord: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 8.5c2.7-.9 5.3-.9 8 0M8.5 16c2.3.7 4.7.7 7 0M9 13.2c-.5.7-1 .7-1.5 0-.5-.7-.5-1.8 0-2.5.5-.7 1-.7 1.5 0M16 13.2c.5.7 1 .7 1.5 0 .5-.7.5-1.8 0-2.5-.5-.7-1-.7-1.5 0M16.5 5.5C15 5 13.5 4.8 12 4.8s-3 .2-4.5.7C5.5 8 5 11.5 5.2 15c1.4 1.1 2.9 1.8 4.5 2.2l.7-1.4M16.8 5.5c1.5.5 3 .7 4.5.7.2 3.5-.3 7-2.5 9.8-1.6 1-3.1 1.7-4.5 2.1l-.7-1.4"/></svg>',
  namemc:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>',
  default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 007.5.4l2-2a5 5 0 00-7-7l-1.2 1.1M14 11a5 5 0 00-7.5-.4l-2 2a5 5 0 007 7l1.1-1.1"/></svg>'
};

function makeCard({ inner, link, delay }) {
  const isReal = link && link !== "#";
  const tag = document.createElement(isReal ? "a" : "div");
  if (isReal) { tag.href = link; tag.target = "_blank"; tag.rel = "noopener"; }
  tag.className = "card";
  tag.style.animationDelay = delay + "ms";
  tag.innerHTML = inner + (isReal ? '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M8 7h9v9"/></svg>' : "");
  return tag;
}

function render() {
  document.getElementById("avatarInitial").textContent = PROFILE.avatarInitial || PROFILE.name.charAt(0);
  document.getElementById("pName").textContent = PROFILE.name;
  document.getElementById("pRole").textContent = PROFILE.role;

  const statsEl = document.getElementById("pStats");
  statsEl.innerHTML = PROFILE.stats.map(s => `<span><b>${s.label}:</b> ${s.value}</span>`).join("");

  const curGrid = document.getElementById("currentlyGrid");
  curGrid.innerHTML = "";
  PROFILE.currently.forEach((c, i) => {
    curGrid.appendChild(makeCard({
      link: c.link,
      delay: i * 60,
      inner: `<div class="card-title">${c.title}</div><span class="badge ${c.color}">${c.badge}</span>`
    }));
  });

  const linksGrid = document.getElementById("linksGrid");
  linksGrid.innerHTML = "";
  PROFILE.links.forEach((l, i) => {
    linksGrid.appendChild(makeCard({
      link: l.link,
      delay: i * 60,
      inner: `<div class="link-icon">${ICONS[l.icon] || ICONS.default}</div><div class="card-title">${l.name}</div><span class="badge cyan">${l.value}</span>`
    }));
  });

  const expEl = document.getElementById("experienceContent");
  expEl.innerHTML = "";
  let delay = 0;
  Object.entries(PROFILE.experience).forEach(([category, items]) => {
    const label = document.createElement("div");
    label.className = "category-label";
    label.textContent = category;
    expEl.appendChild(label);

    const grid = document.createElement("div");
    grid.className = "grid";
    items.forEach(item => {
      grid.appendChild(makeCard({
        link: item.link,
        delay: delay,
        inner: `<div class="card-title">${item.name}</div><div class="card-period">${item.period}</div><span class="badge ${item.color}">${item.badge}</span>`
      }));
      delay += 50;
    });
    expEl.appendChild(grid);
  });
}

function setupNav() {
  const buttons = document.querySelectorAll(".nav-btn");
  const views = document.querySelectorAll(".view");
  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("active")) return;
      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      views.forEach(v => v.classList.remove("active"));
      const target = document.getElementById(btn.dataset.view);
      target.classList.add("active");
    });
  });
}

render();
setupNav();
</script>
</body>
</html>
