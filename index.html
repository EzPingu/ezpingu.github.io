<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EzPingu — Staff Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ⚙️  CONTENUTO DA MODIFICARE → vai in fondo al file, nel tag
   <script>, dentro l'oggetto PROFILE. Tutto il resto è grafica
   e normalmente non serve toccarlo.
   ============================================================ */

:root{
  --bg:#0a0d12;
  --bg-2:#0e1218;
  --surface:#11151c;
  --surface-2:#141920;
  --border:#20262f;
  --text:#e9edf2;
  --muted:#818c99;
  --accent:#3fd9c7;
  --accent-dim:#3fd9c722;
  --teal:#2ee6b8;
  --purple:#b48cff;
  --blue:#5b9dff;
  --green:#5fe08a;
  --red:#ff5e78;
  --gray:#8b98a8;
  --radius:14px;
  --sidebar-w:230px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter', sans-serif;
  position:relative;
}

/* ---------- background: quiet, not a light show ---------- */
.bg-glow{
  position:fixed; z-index:0; pointer-events:none; filter:blur(110px); opacity:.16;
  border-radius:50%;
}
.bg-glow.one{ width:460px; height:460px; background:var(--accent); top:-180px; left:-140px; }
.bg-glow.two{ width:380px; height:380px; background:var(--purple); bottom:-160px; right:-120px; opacity:.10; }

/* ---------- layout ---------- */
.app{
  position:relative; z-index:1;
  max-width:1140px;
  margin:0 auto;
  padding:56px 24px 110px;
  display:flex;
  gap:26px;
  align-items:flex-start;
}

/* ---------- sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:8px;
  position:sticky;
  top:56px;
}
.sidebar-title{
  padding:12px 14px 12px;
  color:var(--muted);
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  border-bottom:1px solid var(--border);
  margin-bottom:6px;
}

.nav-btn{
  width:100%;
  display:flex; align-items:center; gap:10px;
  padding:11px 14px;
  background:transparent;
  border:none;
  border-radius:9px;
  color:var(--muted);
  font-family:'Inter', sans-serif;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  text-align:left;
  text-decoration:none;
  position:relative;
  transition:color .2s ease, background .2s ease;
  margin-bottom:2px;
}
.nav-btn svg{ width:16px; height:16px; flex-shrink:0; opacity:.75; }
.nav-btn:hover{ color:var(--text); background:#ffffff06; }
.nav-btn.active{ color:var(--text); background:#ffffff09; }
.nav-btn.active svg{ opacity:1; color:var(--accent); }
.nav-btn.active::before{
  content:'';
  position:absolute; left:0; top:8px; bottom:8px; width:2px;
  border-radius:2px;
  background:var(--accent);
}

/* ---------- main panel ---------- */
.panel{
  flex:1;
  min-width:0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:52px 48px 60px;
}

.view{ scroll-margin-top:56px; }
.view + .view{ margin-top:64px; padding-top:56px; border-top:1px solid var(--border); }

.view-header{
  display:flex; align-items:center; justify-content:center; gap:9px;
  margin-bottom:8px;
}
.view-header svg{ width:18px; height:18px; color:var(--accent); }
.view-title{
  font-family:'Space Grotesk', sans-serif;
  font-size:14.5px; font-weight:600;
}

/* ---------- hero ---------- */
.hero{ text-align:center; margin:32px 0 28px; }
.avatar-wrap{
  position:relative;
  width:112px; height:112px;
  margin:0 auto 20px;
}
.avatar-ring{
  position:absolute; inset:-4px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--purple));
  opacity:.7;
}
.avatar{
  position:absolute; inset:3px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #1b2129, #0a0d12);
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk', sans-serif;
  font-size:32px; font-weight:700;
  color:var(--accent);
}

.name{
  font-family:'Space Grotesk', sans-serif;
  font-size:34px; font-weight:700;
  letter-spacing:-.01em;
  color:var(--text);
  margin-bottom:8px;
}
.role{
  display:inline-flex; align-items:center; gap:7px;
  color:var(--muted);
  font-size:14.5px; font-weight:500;
  margin-bottom:20px;
}
.role svg{ width:13px; height:13px; }

.stat-row{
  display:flex; justify-content:center; gap:32px; flex-wrap:wrap;
  font-size:13.5px;
}
.stat-row b{ color:var(--text); font-weight:600; }
.stat-row span{ color:var(--muted); }

/* ---------- reveal toggle ---------- */
.reveal-bar{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:0 0 6px;
}
.reveal-btn{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--bg-2);
  border:1px solid var(--border);
  color:var(--muted);
  font-family:'Inter', sans-serif;
  font-size:12.5px; font-weight:500;
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
  transition:color .2s ease, border-color .2s ease, background .2s ease;
}
.reveal-btn svg{ width:14px; height:14px; }
.reveal-btn:hover{ color:var(--text); border-color:var(--accent-dim); }
.reveal-btn.on{ color:var(--accent); border-color:var(--accent-dim); background:var(--accent-dim); }
.reveal-hint{ text-align:center; color:var(--muted); font-size:12px; margin-bottom:22px; }

/* ---------- section label ---------- */
.section-label{
  display:flex; align-items:center; gap:9px;
  justify-content:center;
  margin:38px 0 16px;
  color:var(--muted);
  font-family:'JetBrains Mono', monospace;
  font-size:11.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.section-label svg{ width:13px; height:13px; }
.section-label::before, .section-label::after{
  content:''; height:1px; width:56px;
  background:linear-gradient(90deg, transparent, var(--border));
}
.section-label::after{ background:linear-gradient(90deg, var(--border), transparent); }

/* ---------- grid / cards ---------- */
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px){ .grid{ grid-template-columns:1fr; } }

.card{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:19px 18px;
  text-align:center;
  cursor:pointer;
  position:relative;
  text-decoration:none;
  color:inherit;
  display:block;
  transition:border-color .2s ease, transform .2s ease, background .2s ease;
}
.card:hover{ border-color:var(--accent-dim); transform:translateY(-2px); background:var(--surface-2); }
.card:active{ transform:translateY(0); }

.card-title{ font-weight:600; font-size:14.5px; margin-bottom:4px; }
.card-period{ color:var(--muted); font-size:12px; margin-bottom:11px; font-family:'JetBrains Mono', monospace; }
.card-value{ color:var(--accent); font-weight:600; font-size:14px; }

/* hidden-name blur, toggled by the reveal button */
.card-title.hideable, .card-period.hideable{
  filter:blur(6px);
  user-select:none;
  transition:filter .3s ease;
}
body.reveal .hideable{ filter:blur(0); }

.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-family:'JetBrains Mono', monospace;
  font-size:10px; font-weight:600;
  letter-spacing:.05em;
  padding:5px 10px;
  border-radius:6px;
  border:1px solid transparent;
}
.badge.cyan{  color:var(--accent); background:#3fd9c718; border-color:#3fd9c73d; }
.badge.teal{  color:var(--teal);   background:#2ee6b818; border-color:#2ee6b83d; }
.badge.green{ color:var(--green);  background:#5fe08a18; border-color:#5fe08a3d; }
.badge.blue{  color:var(--blue);   background:#5b9dff18; border-color:#5b9dff3d; }
.badge.purple{color:var(--purple); background:#b48cff18; border-color:#b48cff3d; }
.badge.red{   color:var(--red);    background:#ff5e7818; border-color:#ff5e783d; }
.badge.gray{  color:var(--gray);   background:#8b98a818; border-color:#8b98a83d; }

.link-icon{ width:24px; height:24px; margin:0 auto 9px; color:var(--muted); transition:color .2s ease; }
.card:hover .link-icon{ color:var(--accent); }

.category-label{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600; font-size:13.5px;
  color:var(--text);
  margin:28px 0 11px;
  display:flex; align-items:center; gap:8px;
}
.category-label:first-of-type{ margin-top:4px; }
.category-label::before{ content:''; width:5px; height:5px; border-radius:50%; background:var(--accent); }

.go{
  position:absolute; top:14px; right:14px;
  width:14px; height:14px; color:var(--muted);
  opacity:0; transition:opacity .2s ease;
}
.card:hover .go{ opacity:.8; }

::-webkit-scrollbar{ width:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }

@media (max-width:820px){
  .app{ flex-direction:column; }
  .sidebar{ width:100%; position:relative; top:0; display:flex; gap:4px; }
  .nav-btn{ flex:1; justify-content:center; }
  .panel{ padding:36px 20px 44px; }
  .name{ font-size:28px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body class="reveal">

<div class="bg-glow one"></div>
<div class="bg-glow two"></div>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-title">Menu</div>
    <a class="nav-btn active" data-view="about" href="#about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      About myself
    </a>
    <a class="nav-btn" data-view="experience" href="#experience">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.1-3.1a4 4 0 01-5.3 5.3L7 20l-3-3 8.5-8.5a4 4 0 015.3-5.3l-3.1 3.1z"/></svg>
      Staff Experience
    </a>
  </aside>

  <main class="panel">

    <!-- ================= ABOUT ================= -->
    <section id="about" class="view">
      <div class="view-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span class="view-title">About myself</span>
      </div>

      <div class="hero">
        <div class="avatar-wrap">
          <div class="avatar-ring"></div>
          <div class="avatar" id="avatarInitial"></div>
        </div>
        <h1 class="name" id="pName"></h1>
        <div class="role"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span id="pRole"></span></div>
        <div class="stat-row" id="pStats"></div>
      </div>

      <div class="reveal-bar">
        <button class="reveal-btn" id="toggleNames">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="toggleLabel">Nascondi nomi server</span>
        </button>
      </div>
      <p class="reveal-hint">I nomi dei server sono visibili di default — premi il pulsante per nasconderli quando vuoi.</p>

      <div class="section-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a4 4 0 00-3-3.9M9 20H4v-2a4 4 0 013-3.9m5-3a4 4 0 100-8 4 4 0 000 8zm6 1a4 4 0 100-8"/></svg>
        Currently
      </div>
      <div class="grid" id="currentlyGrid"></div>

      <div class="section-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.5.4l2-2a5 5 0 00-7-7l-1.2 1.1M14 11a5 5 0 00-7.5-.4l-2 2a5 5 0 007 7l1.1-1.1"/></svg>
        Links
      </div>
      <div class="grid" id="linksGrid"></div>
    </section>

    <!-- ================= EXPERIENCE ================= -->
    <section id="experience" class="view">
      <div class="view-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.1-3.1a4 4 0 01-5.3 5.3L7 20l-3-3 8.5-8.5a4 4 0 015.3-5.3l-3.1 3.1z"/></svg>
        <span class="view-title">Staff Experience</span>
      </div>
      <div id="experienceContent"></div>
    </section>

  </main>
</div>

<script>
/* ==========================================================================
   ✏️  MODIFICA SOLO QUI SOTTO — tutto il resto del file è grafica/motore.
   ==========================================================================
   - "link": true metti l'URL che vuoi far aprire quando si clicca la card.
   - "color" può essere: cyan, teal, green, blue, purple, red, gray.
   - I nomi dei server (currently + experience) si nascondono/mostrano col
     bottone "Mostra/Nascondi nomi server" — non serve fare nulla per questo,
     funziona automaticamente su qualsiasi nome tu scriva.
   - Per aggiungere/togliere una card, copia o cancella un blocco { ... }.
   ========================================================================== */

const PROFILE = {
  name: "EzPingu",
  avatarInitial: "E",
  role: "Staff & SS Checker",
  stats: [
    { label: "Age", value: "17 y/o" },
    { label: "Place", value: "Italy" },
    { label: "Occupation", value: "Student • Staff Minecraft" }
  ],

  currently: [
    {
      title: "Tierlist",
      badge: "SS VERIFIED", color: "red",
      link: "#"
    }
  ],

  links: [
    { name: "Discord", value: "@EZPINGU", icon: "discord", link: "https://discord.com/users/YOUR-ID" },
    { name: "guns.lol", value: "ezpingu",  icon: "gunslol", link: "https://guns.lol/ezpingu" }
  ],

  experience: {
    "Minecraft": [
      { name: "Server 1", period: "January 2025", badge: "STAFFER, SUPPORTER", color: "teal", link: "#" },
      { name: "Server 2", period: "July 2025 to September 2025", badge: "MOD, HEAD SS", color: "green", link: "#" },
      { name: "Server 3", period: "October 2025 to June 2026", badge: "ADMIN, HEAD SS", color: "teal", link: "#" },
      { name: "Server 4", period: "June 2026", badge: "MOD, SS MANAGER", color: "blue", link: "#" }
    ],
    "Discord": [
      { name: "Tierlist 1", period: "December 2025 to March 2026", badge: "SS VERIFIED", color: "blue", link: "#" },
      { name: "Tierlist 2", period: "December 2025 to now", badge: "SS VERIFIED", color: "red", link: "#" },
      { name: "Community 1", period: "January 2026 to February 2026", badge: "SS VERIFIED", color: "purple", link: "#" },
      { name: "Tier Tests 1", period: "February 2026 to May 2026", badge: "SS VERIFIED", color: "blue", link: "#" },
      { name: "Tier Tests 2", period: "February 2026 to May 2026", badge: "SS VERIFIED", color: "cyan", link: "#" },
      { name: "Anticheat Team", period: "March 2026", badge: "PC CHECKER", color: "green", link: "#" }
    ]
  }
};

/* ========================================================================
   Da qui in giù è il motore di rendering: normalmente non serve toccarlo.
   ======================================================================== */

const ICONS = {
  discord: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 8.5c2.7-.9 5.3-.9 8 0M8.5 16c2.3.7 4.7.7 7 0M9 13.2c-.5.7-1 .7-1.5 0-.5-.7-.5-1.8 0-2.5.5-.7 1-.7 1.5 0M16 13.2c.5.7 1 .7 1.5 0 .5-.7.5-1.8 0-2.5-.5-.7-1-.7-1.5 0M16.5 5.5C15 5 13.5 4.8 12 4.8s-3 .2-4.5.7C5.5 8 5 11.5 5.2 15c1.4 1.1 2.9 1.8 4.5 2.2l.7-1.4M16.8 5.5c1.5.5 3 .7 4.5.7.2 3.5-.3 7-2.5 9.8-1.6 1-3.1 1.7-4.5 2.1l-.7-1.4"/></svg>',
  gunslol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 007.5.4l2-2a5 5 0 00-7-7l-1.2 1.1M14 11a5 5 0 00-7.5-.4l-2 2a5 5 0 007 7l1.1-1.1"/></svg>',
  default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 007.5.4l2-2a5 5 0 00-7-7l-1.2 1.1M14 11a5 5 0 00-7.5-.4l-2 2a5 5 0 007 7l1.1-1.1"/></svg>'
};

function makeCard({ inner, link }) {
  const isReal = link && link !== "#";
  const tag = document.createElement(isReal ? "a" : "div");
  if (isReal) { tag.href = link; tag.target = "_blank"; tag.rel = "noopener"; }
  tag.className = "card";
  tag.innerHTML = inner + (isReal ? '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M8 7h9v9"/></svg>' : "");
  return tag;
}

function render() {
  document.getElementById("avatarInitial").textContent = PROFILE.avatarInitial || PROFILE.name.charAt(0);
  document.getElementById("pName").textContent = PROFILE.name;
  document.getElementById("pRole").textContent = PROFILE.role;

  document.getElementById("pStats").innerHTML =
    PROFILE.stats.map(s => `<span><b>${s.label}:</b> ${s.value}</span>`).join("");

  const curGrid = document.getElementById("currentlyGrid");
  curGrid.innerHTML = "";
  PROFILE.currently.forEach(c => {
    curGrid.appendChild(makeCard({
      link: c.link,
      inner: `<div class="card-title hideable">${c.title}</div><span class="badge ${c.color}">${c.badge}</span>`
    }));
  });

  const linksGrid = document.getElementById("linksGrid");
  linksGrid.innerHTML = "";
  PROFILE.links.forEach(l => {
    linksGrid.appendChild(makeCard({
      link: l.link,
      inner: `<div class="link-icon">${ICONS[l.icon] || ICONS.default}</div><div class="card-title">${l.name}</div><span class="badge cyan">${l.value}</span>`
    }));
  });

  const expEl = document.getElementById("experienceContent");
  expEl.innerHTML = "";
  Object.entries(PROFILE.experience).forEach(([category, items]) => {
    const label = document.createElement("div");
    label.className = "category-label";
    label.textContent = category;
    expEl.appendChild(label);

    const grid = document.createElement("div");
    grid.className = "grid";
    items.forEach(item => {
      grid.appendChild(makeCard({
        link: item.link,
        inner: `<div class="card-title hideable">${item.name}</div><div class="card-period">${item.period}</div><span class="badge ${item.color}">${item.badge}</span>`
      }));
    });
    expEl.appendChild(grid);
  });
}

function setupToggle() {
  const btn = document.getElementById("toggleNames");
  const label = document.getElementById("toggleLabel");
  btn.addEventListener("click", () => {
    const revealed = document.body.classList.toggle("reveal");
    label.textContent = revealed ? "Nascondi nomi server" : "Mostra nomi server";
    btn.classList.toggle("on", !revealed);
  });
}

function setupScrollSpy() {
  const links = document.querySelectorAll(".nav-btn");
  const sections = [...links].map(l => document.getElementById(l.dataset.view));
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        links.forEach(l => l.classList.remove("active"));
        const active = [...links].find(l => l.dataset.view === entry.target.id);
        if (active) active.classList.add("active");
      }
    });
  }, { rootMargin: "-40% 0px -55% 0px", threshold: 0 });
  sections.forEach(s => s && observer.observe(s));
}

render();
setupToggle();
setupScrollSpy();
</script>
</body>
</html>
